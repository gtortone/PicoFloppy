name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:

    - uses: actions/checkout@v4

    - name: Set environment variables
      id: vars
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Dependency packages (apt)
      run: |
        sudo apt update
        sudo apt -y install git cmake gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib build-essential python3 zip unzip wget

    - name: pico-sdk
      run: |
        git clone --depth 1 -b 2.2.0 https://github.com/raspberrypi/pico-sdk ../pico-sdk
        git -C ../pico-sdk submodule update --init --depth 1 lib/tinyusb

    - name: Build (prod, debug, logfile) and package
      run: |
        export PICO_SDK_PATH=$(realpath ../pico-sdk)
        scripts/mk_dist.sh ${{ steps.vars.outputs.sha_short }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PicoFloppy.CI.${{ steps.vars.outputs.sha_short }}
        path: dist/PicoFloppy-${{ steps.vars.outputs.sha_short }}.zip
